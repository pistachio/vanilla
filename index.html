<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Text | Zen Mode</title>
        <!-- The Ice Cream Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍦</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --text-dark: #141413; --text-light: #faf9f5;
            --bg-light: #faf9f5; --bg-dark: #141413;
            --secondary: #8e8c84; --subtle-bg: #e8e6dc;
            --accent-orange: #d97757; --accent-blue: #6a9bcc;
            --accent-green: #788c5d; --accent-purple: #8c6d9c;
            --current-bg: var(--bg-light); --current-text: var(--text-dark);
            --border: var(--subtle-bg); --hud-bg: rgba(20, 20, 19, 0.92);
            --hud-text: #faf9f5; --dock-bg: rgba(255, 255, 255, 0.85);
            --mic-active: #d9534f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --current-bg: var(--bg-dark); --current-text: var(--text-light);
                --border: #2d2d2b; --hud-bg: rgba(250, 249, 245, 0.94);
                --hud-text: #141413; --dock-bg: rgba(28, 28, 27, 0.85);
            }
        }

        html, body {
            height: 100%; overflow: hidden; background-color: var(--current-bg);
            font-family: 'Lora', Georgia, serif; color: var(--current-text); font-size: 16px;
        }

        #top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; z-index: 100;
            background: linear-gradient(to bottom, var(--current-bg) 60%, transparent);
        }
        #nav-left, #nav-right { display: flex; gap: 20px; align-items: center; }
        .nav-btn {
            background: none; border: none; color: var(--secondary);
            font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: color 0.2s;
        }
        .nav-btn:hover { color: var(--accent-orange); }
        #word-count { font-family: 'Poppins', sans-serif; font-size: 0.75rem; color: var(--secondary); }
        #sync-status {
            font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.75rem;
            color: var(--accent-green); opacity: 0; transition: opacity 0.2s; margin-right: 10px;
        }

        #app { display: flex; justify-content: center; height: 100vh; padding: 80px 24px 140px 24px; }
        #main-text {
            width: 100%; max-width: 760px; height: 100%; border: none; outline: none;
            background: transparent; resize: none; overflow-y: auto;
            font-size: 1.25rem; line-height: 1.8; color: var(--current-text);
            font-family: 'Lora', Georgia, serif; scrollbar-width: none;
        }
        #main-text::-webkit-scrollbar { display: none; }
        #main-text::placeholder { color: var(--secondary); opacity: 0.4; }

        #control-dock {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 12px;
            background: var(--dock-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 10px 20px; border-radius: 999px; border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 100;
        }

        .btn {
            color: #fff; border-radius: 50%; border: none; cursor: pointer;
            transition: transform 0.15s ease, filter 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn:active { transform: scale(0.9); }
        .btn:hover { filter: brightness(1.1); }
        .btn-sm { width: 38px; height: 38px; background: var(--border); color: var(--current-text); opacity: 0.7; }
        .btn-sm:hover { opacity: 1; }
        .btn-mic { 
            width: 56px; height: 56px; background: var(--accent-orange); margin: 0 8px; 
            transition: background-color 0.3s ease, transform 0.15s ease;
        }
        .btn-copy:hover { color: var(--accent-blue); }
        .btn-speak:hover { color: var(--accent-green); }
        .btn-archive:hover { color: var(--accent-purple); }

        .btn-mic.mic-live { background: var(--mic-active); animation: pulse-red 1.2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(217,83,79,0.6); }
            70% { box-shadow: 0 0 0 16px rgba(217,83,79,0); }
            100% { box-shadow: 0 0 0 0 rgba(217,83,79,0); }
        }

        #live-hud {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--hud-bg); color: var(--hud-text); padding: 16px 24px; border-radius: 24px;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 500; 
            width: calc(100% - 48px); max-width: 760px; text-align: left; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease; z-index: 105;
            display: flex; align-items: center;
        }
        #live-hud.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        #live-hud .hud-dot {
            display: inline-block; width: 10px; height: 10px; background: var(--accent-orange);
            border-radius: 50%; margin-right: 12px; vertical-align: middle; flex-shrink: 0;
        }

        .drawer-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 200;
        }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }

        .drawer {
            position: fixed; top: 0; right: -400px; bottom: 0; width: 400px; max-width: 100vw;
            background: var(--current-bg); border-left: 1px solid var(--border);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1); transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 201; display: flex; flex-direction: column; padding: 32px; overflow-y: auto;
        }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .drawer-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1rem; color: var(--current-text); }
        .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--secondary); cursor: pointer; }

        .settings-grid { display: flex; flex-direction: column; gap: 24px; }
        .settings-grid label {
            font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.7rem;
            letter-spacing: 0.05em; text-transform: uppercase; color: var(--secondary);
            display: block; margin-bottom: 8px;
        }
        .settings-grid select, .settings-grid input[type="text"] {
            width: 100%; background: var(--bg-light); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px; outline: none; color: var(--current-text);
            font-family: 'Poppins', sans-serif; font-size: 0.9rem;
        }
        @media (prefers-color-scheme: dark) {
            .settings-grid select, .settings-grid input[type="text"] { background: var(--bg-dark); }
        }

        .history-item {
            display: flex; flex-direction: column; gap: 4px; padding: 12px;
            border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;
            cursor: pointer; transition: background 0.2s;
        }
        .history-item:hover { background: rgba(128,128,128,0.05); }
        .history-item .time-tag { font-family: 'Poppins', sans-serif; font-size: 0.65rem; color: var(--accent-blue); }
        .history-item .snippet { font-size: 0.85rem; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 768px) {
            #app { padding: 60px 16px 140px 16px; }
            #top-bar { padding: 0 16px; }
            #control-dock { gap: 8px; padding: 8px 12px; }
            .btn-sm { width: 36px; height: 36px; }
            .btn-mic { width: 48px; height: 48px; }
            .drawer { width: 100%; }
            #live-hud { bottom: 120px; font-size: 0.85rem; padding: 12px 16px; }
        }
    </style>
</head>
<body>

<div id="top-bar">
    <div id="nav-left">
        <button class="nav-btn" onclick="toggleDrawer('settings-drawer')">Settings</button>
        <button class="nav-btn" onclick="toggleDrawer('history-drawer')">Archive</button>
        <span id="sync-status">Saved</span>
    </div>
    <div id="nav-right">
        <span id="word-count">0 words</span>
    </div>
</div>

<div id="app">
    <textarea id="main-text" placeholder="Tap the orange mic or start typing..."></textarea>
</div>

<div id="live-hud">
    <span class="hud-dot"></span>
    <span id="hud-text" style="overflow: hidden; text-overflow: ellipsis;">Listening...</span>
</div>

<div id="control-dock">
    <button id="archive-btn" class="btn btn-sm btn-archive" title="Archive & Clear">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
    </button>
    <button id="copy-btn" class="btn btn-sm btn-copy" title="Copy to Clipboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    </button>
    
    <button id="mic-btn" class="btn btn-mic" title="Toggle Voice Dictation (Alt+M)">
        <svg id="mic-icon-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
    </button>

    <button id="speak-btn" class="btn btn-sm btn-speak" title="Read Aloud (Alt+P) — Reads selection or full text">
        <svg id="speak-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    </button>
    
    <button id="clear-btn" class="btn btn-sm btn-clear" title="Clear Draft">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </button>
</div>

<div id="drawer-overlay" class="drawer-overlay" onclick="closeAllDrawers()"></div>

<div id="settings-drawer" class="drawer">
    <div class="drawer-header">
        <span class="drawer-title">Settings</span>
        <button class="close-btn" onclick="closeAllDrawers()">&times;</button>
    </div>
    <div class="settings-grid">
        <div>
            <label>Dictation Language</label>
            <select id="mic-lang-select">
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="de-DE">Deutsch (DE)</option>
                <option value="fr-FR">Français (FR)</option>
                <option value="es-ES">Español (ES)</option>
            </select>
        </div>
        <div>
            <label>Spoken Commands</label>
            <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:0.85rem; letter-spacing:0; cursor:pointer;">
                <input type="checkbox" id="voice-commands-toggle" checked style="width:16px; height:16px; accent-color:var(--accent-orange);"> 
                Parse "new line", punctuation
            </label>
        </div>
        <div>
            <label>Read-Aloud Voice</label>
            <select id="voice-select"></select>
        </div>
        <div>
            <label>Playback Speed: <span id="speed-display">1.0</span>x</label>
            <input type="range" id="speed-range" min="0.5" max="2.0" step="0.1" value="1.0" style="width:100%; accent-color:var(--accent-orange);">
        </div>
    </div>
</div>

<div id="history-drawer" class="drawer">
    <div class="drawer-header">
        <span class="drawer-title">Archive</span>
        <button class="close-btn" onclick="closeAllDrawers()">&times;</button>
    </div>
    <div id="history-list"></div>
</div>

<script>
    // --- DOM & STATE ---
    const tx = document.getElementById('main-text');
    const speakBtn = document.getElementById('speak-btn');
    const speakIcon = document.getElementById('speak-icon');
    const micBtn = document.getElementById('mic-btn');
    const micIconSvg = document.getElementById('mic-icon-svg');
    const syncStatus = document.getElementById('sync-status');
    const voiceSelect = document.getElementById('voice-select');
    const micLangSelect = document.getElementById('mic-lang-select');
    const voiceCommandsToggle = document.getElementById('voice-commands-toggle');
    const speedRange = document.getElementById('speed-range');
    const speedDisplay = document.getElementById('speed-display');
    const wordCountEl = document.getElementById('word-count');
    const liveHud = document.getElementById('live-hud');
    const hudText = document.getElementById('hud-text');

    const ICONS = {
        PLAY: `<polygon points="5 3 19 12 5 21 5 3"></polygon>`,
        STOP_TTS: `<rect x="6" y="6" width="12" height="12" rx="2"></rect>`,
        MIC: `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>`,
        STOP_REC: `<rect x="7" y="7" width="10" height="10" rx="2"></rect>`
    };

    function updateStats() {
        const text = tx.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        wordCountEl.textContent = `${words} word${words === 1 ? '' : 's'}`;
    }

    function notify(msg = 'Saved') {
        syncStatus.textContent = msg;
        syncStatus.style.opacity = '1';
        clearTimeout(window._syncTimer);
        window._syncTimer = setTimeout(() => syncStatus.style.opacity = '0', 1600);
    }

    // --- SPEECH SYNTHESIS (Read Aloud) ---
    const synth = window.speechSynthesis;
    let voices = [];
    
    let isTtsSpeaking = false;
    let isTtsPaused = false;
    let ttsKeepAliveTimer = null;
    let currentlyPlayingText = ''; 

    function loadVoices() {
        voices = synth.getVoices();
        if (!voices.length) return;
        voiceSelect.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name}</option>`).join('');
        const saved = localStorage.getItem('vt_voice_idx');
        if (saved !== null && voices[saved]) voiceSelect.value = saved;
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function resetSpeakUI() {
        clearInterval(ttsKeepAliveTimer);
        isTtsSpeaking = false;
        isTtsPaused = false;
        currentlyPlayingText = '';
        speakIcon.innerHTML = ICONS.PLAY;
    }

    function startTts(textToRead) {
        if (!textToRead) return;
        
        currentlyPlayingText = textToRead;
        const utt = new SpeechSynthesisUtterance(textToRead);
        utt.voice = voices[voiceSelect.value] || null;
        utt.rate = parseFloat(speedRange.value);

        utt.onstart = () => {
            isTtsSpeaking = true;
            isTtsPaused = false;
            speakIcon.innerHTML = ICONS.STOP_TTS;
            
            clearInterval(ttsKeepAliveTimer);
            ttsKeepAliveTimer = setInterval(() => {
                if (isTtsSpeaking && !isTtsPaused) {
                    synth.pause();
                    synth.resume();
                }
            }, 10000);
        };

        utt.onend = utt.onerror = () => resetSpeakUI();
        synth.speak(utt);
    }

    speakBtn.addEventListener('click', () => {
        const selStart = tx.selectionStart;
        const selEnd = tx.selectionEnd;
        const selectedText = (selStart !== selEnd) ? tx.value.substring(selStart, selEnd).trim() : '';
        const currentSelection = selectedText.length > 0 ? selectedText : tx.value.trim();

        if (isTtsSpeaking) {
            if (!isTtsPaused) {
                synth.pause();
                isTtsPaused = true;
                speakIcon.innerHTML = ICONS.PLAY;
            } else {
                if (currentSelection !== currentlyPlayingText) {
                    synth.cancel(); 
                    resetSpeakUI();
                    startTts(currentSelection); 
                } else {
                    synth.resume();
                    isTtsPaused = false;
                    speakIcon.innerHTML = ICONS.STOP_TTS;
                }
            }
            return;
        }

        synth.cancel(); 
        startTts(currentSelection);
    });

    // --- VOICE INPUT (Dictation) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let micActive = false;

    function formatSpokenText(raw, precedingChar) {
        let text = raw;
        if (voiceCommandsToggle.checked) {
            text = text.replace(/\bnew paragraph\b/gi, '\n\n')
                       .replace(/\bnew line\b/gi, '\n')
                       .replace(/\bbullet point\b/gi, '\n- ')
                       .replace(/\bperiod\b/gi, '.')
                       .replace(/\bcomma\b/gi, ',')
                       .replace(/\bquestion mark\b/gi, '?');
        }
        text = text.replace(/\s+([.,?!:;])/g, '$1').trim();
        if (!text) return '';

        const needsLeadingSpace = precedingChar && !/[\s\n"(-]/.test(precedingChar) && !/^[.,?!:;\n]/.test(text);
        const shouldCapitalize = !precedingChar || /[.?!\n]\s*$/.test(precedingChar);
        if (shouldCapitalize && /^[a-z]/.test(text)) text = text.charAt(0).toUpperCase() + text.slice(1);
        text = text.replace(/([.?!\n]\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());
        const trailingSpace = /\n$/.test(text) ? '' : ' ';
        return (needsLeadingSpace ? ' ' : '') + text + trailingSpace;
    }

    // THE FIX IS IN THIS FUNCTION:
    function insertAtCursor(str) {
        const start = tx.selectionStart;
        const end = tx.selectionEnd;
        
        // Get the characters immediately before the cursor for formatting
        const before = tx.value.substring(0, start);
        const formatted = formatSpokenText(str, before.slice(-2));
        if (!formatted) return;

        // setRangeText is a native browser method that inserts text 
        // at the exact cursor location WITHOUT scrolling the page!
        tx.setRangeText(formatted, start, end, 'end');
        
        // Manually trigger the input event so our autosave and word count update
        tx.dispatchEvent(new Event('input'));
    }

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = localStorage.getItem('vt_mic_lang') || 'en-US';

        recognition.onresult = (e) => {
            let finalChunk = '', interimChunk = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                const tr = e.results[i][0].transcript;
                if (e.results[i].isFinal) finalChunk += tr + ' ';
                else interimChunk += tr;
            }
            if (interimChunk.trim()) { hudText.textContent = interimChunk.trim(); liveHud.classList.add('visible'); }
            else { hudText.textContent = 'Listening...'; }
            if (finalChunk.trim()) { insertAtCursor(finalChunk); hudText.textContent = 'Listening...'; }
        };

        recognition.onerror = (e) => {
            if (e.error === 'not-allowed') { stopMic(); alert('Microphone blocked. Ensure you are on HTTPS.'); }
        };
        recognition.onend = () => { if (micActive) try { recognition.start(); } catch (err) {} };
    }

    function startMic() {
        if (!recognition) return alert('Use Chrome, Edge, or Safari for dictation.');
        if (isTtsSpeaking) { synth.cancel(); resetSpeakUI(); }
        
        recognition.lang = micLangSelect.value;
        micActive = true;
        try { recognition.start(); } catch (e) {}
        
        micBtn.classList.add('mic-live');
        micIconSvg.innerHTML = ICONS.STOP_REC;
        hudText.textContent = 'Listening...';
        liveHud.classList.add('visible');
        
        // Note: We removed the tx.focus() here because focusing the textarea 
        // can sometimes cause the browser to jump to the cursor. 
        // As long as the user clicked in the text before hitting the mic, it will type in the right place.
    }

    function stopMic() {
        micActive = false;
        if (recognition) try { recognition.stop(); } catch (e) {}
        
        micBtn.classList.remove('mic-live');
        micIconSvg.innerHTML = ICONS.MIC;
        liveHud.classList.remove('visible');
    }

    micBtn.addEventListener('click', () => micActive ? stopMic() : startMic());

    // --- ACTIONS & DRAWERS ---
    function saveToHistory(text) {
        if (!text) return;
        const history = JSON.parse(localStorage.getItem('vt_history') || '[]');
        const timestamp = new Date().toLocaleString([], { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        history.unshift({ text, date: timestamp });
        localStorage.setItem('vt_history', JSON.stringify(history.slice(0, 50)));
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(tx.value).then(() => notify('Copied'));
    });

    document.getElementById('archive-btn').addEventListener('click', () => {
        const text = tx.value.trim();
        if (!text) return;
        navigator.clipboard.writeText(text).catch(() => {});
        saveToHistory(text);
        tx.value = '';
        localStorage.setItem('vt_draft', '');
        updateStats();
        notify('Archived & Copied');
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
        if (!tx.value.trim()) return;
        if (confirm('Discard draft?')) { tx.value = ''; localStorage.setItem('vt_draft', ''); updateStats(); }
    });

    window.toggleDrawer = (id) => {
        const target = document.getElementById(id);
        const overlay = document.getElementById('drawer-overlay');
        const isOpen = target.classList.contains('open');
        closeAllDrawers();
        if (!isOpen) {
            target.classList.add('open');
            overlay.classList.add('open');
            if (id === 'history-drawer') renderHistory();
        }
    };

    window.closeAllDrawers = () => {
        document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
        document.getElementById('drawer-overlay').classList.remove('open');
    };

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('vt_history') || '[]');
        const list = document.getElementById('history-list');
        if (!history.length) {
            list.innerHTML = '<div style="font-size:0.85rem; opacity:0.5;">No archived notes yet.</div>';
            return;
        }
        list.innerHTML = history.map((item, idx) => `
            <div class="history-item" onclick="restoreDraft(${idx})">
                <div class="time-tag">${item.date}</div>
                <div class="snippet">${item.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
            </div>
        `).join('');
    }

    window.restoreDraft = (idx) => {
        const history = JSON.parse(localStorage.getItem('vt_history') || '[]');
        if (!history[idx]) return;
        tx.value = tx.value.trim() ? tx.value.trim() + '\n\n' + history[idx].text : history[idx].text;
        localStorage.setItem('vt_draft', tx.value);
        updateStats();
        closeAllDrawers();
        notify('Restored');
    };

    // --- PERSISTENCE & SHORTCUTS ---
    tx.addEventListener('input', () => {
        updateStats();
        localStorage.setItem('vt_draft', tx.value);
        notify('Saved');
    });

    speedRange.addEventListener('input', () => {
        speedDisplay.textContent = speedRange.value;
        localStorage.setItem('vt_speed', speedRange.value);
    });

    micLangSelect.addEventListener('change', () => {
        localStorage.setItem('vt_mic_lang', micLangSelect.value);
        if (recognition) {
            recognition.lang = micLangSelect.value;
            if (micActive) { stopMic(); setTimeout(startMic, 150); }
        }
    });

    voiceCommandsToggle.addEventListener('change', () => {
        localStorage.setItem('vt_voice_cmds', voiceCommandsToggle.checked ? '1' : '0');
    });

    window.addEventListener('keydown', (e) => {
        if (e.altKey && e.code === 'KeyM') { e.preventDefault(); micBtn.click(); }
        else if (e.altKey && e.code === 'KeyP') { e.preventDefault(); speakBtn.click(); }
        else if (e.key === 'Escape') { closeAllDrawers(); }
    });

    // Init
    window.addEventListener('load', () => {
        tx.value = localStorage.getItem('vt_draft') || '';
        updateStats();
        
        const speed = localStorage.getItem('vt_speed') || '1.0';
        speedRange.value = speed;
        speedDisplay.textContent = speed;

        const savedLang = localStorage.getItem('vt_mic_lang') || 'en-US';
        micLangSelect.value = savedLang;

        const savedCmds = localStorage.getItem('vt_voice_cmds');
        if (savedCmds !== null) voiceCommandsToggle.checked = savedCmds === '1';

        setTimeout(loadVoices, 300);
    });
</script>
</body>
</html>
